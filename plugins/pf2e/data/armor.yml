# Static armor reference data.
# Lookup: Pf2e.read_data("armor", "leather")
#
# Fields:
#   name          — display name
#   category      — unarmored | light | medium | heavy
#                   (drives which armor proficiency rank applies)
#   ac_bonus      — item bonus to AC
#   dex_cap       — max Dex modifier allowed (null = no cap)
#   check_penalty — penalty to Str- and Dex-based skill checks (0 or negative)
#   speed_penalty — penalty to Speed in feet (0 or negative)
#   strength      — minimum Strength score to ignore check/speed penalties
#                   (null if none)
#   bulk          — L / 1 / 2 / etc.
#   group         — armor group (leather, composite, plate, …) for future effects
#   traits        — array of trait slugs (comfortable, noisy, …)
#   price         — optional, in sp
#
# Proficiency rank is NOT stored here — it comes from the character
# (trained in light armor, etc.). The category tells the caller which
# rank field to read once we store armor proficiencies on the sheet.
#
# Unarmored entries exist so the same lookup path works for "no armor".

armor:
  explorers_clothing:
    name: "Explorer's Clothing"
    category: unarmored
    ac_bonus: 0
    dex_cap: null
    check_penalty: 0
    speed_penalty: 0
    strength: null
    bulk: L
    group: cloth
    traits: [comfort]
    price: 1

  leather:
    name: Leather Armor
    category: light
    ac_bonus: 1
    dex_cap: 4
    check_penalty: -1
    speed_penalty: 0
    strength: 10
    bulk: 1
    group: leather
    traits: []
    price: 20

