# Spell catalog (PF2e Remaster) - Pathfinder Player Core
# From Foundry VTT pf2e packs/pf2e/spells (publication.title == Pathfinder Player Core).
# Lookup: Pf2e.read_data("spells", "<slug>")
# rank 0 = cantrip; category: cantrip | spell | focus | ritual
# Mechanical fields only (no full rules text - use AON at table for prose).
#
spells:
  animate_object:
    name: Animate Object
    rank: 2
    category: ritual
    rarity: uncommon
    cast: 1 day
    source: Pathfinder Player Core
    range: 10 feet
    target: 1 object
    cost: rare oils, see Creature Creation Rituals
  consecrate:
    name: Consecrate
    rank: 2
    category: ritual
    traits:
    - consecration
    rarity: uncommon
    cast: 3 days
    source: Pathfinder Player Core
    range: 40 feet
    area: burst 40
    duration: 1 year
    cost: rare incense and offerings worth a total value of 20 gp x the spell rank
  create_undead:
    name: Create Undead
    rank: 2
    category: ritual
    traits:
    - unholy
    rarity: uncommon
    cast: 1 day
    source: Pathfinder Player Core
    range: 10 feet
    target: 1 dead creature
    cost: black onyx, see Creature Creation Rituals table
  geas:
    name: Geas
    rank: 3
    category: ritual
    traits:
    - curse
    - mental
    rarity: uncommon
    cast: 1 day
    source: Pathfinder Player Core
    range: 10 feet
    target: 1 creature of a level no greater than double the geas ritual's rank
