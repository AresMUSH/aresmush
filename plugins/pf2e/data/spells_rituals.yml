      you
    cost: rare incense and offerings worth a total value of 20 gp x the target's level
  blight:
    name: Blight
    rank: 4
    category: ritual
    traits:
    - plant
    - void
    rarity: uncommon
    cast: 1 day
    source: Pathfinder Player Core
    duration: 1 year
  plant_growth:
    name: Plant Growth
    rank: 4
    category: ritual
    traits:
    - plant
