# Static ancestry reference data.
# Lookup: Pf2e.read_data("ancestries", "dwarf")
#
# languages:
#   starting          — always known (plus Tradetongue is also forced globally)
#   additional_per_int — if true, player picks ability_mod(int) extra languages
#                        from common (and uncommon if you later allow)
#   additional_options — optional closed list for those free picks; omit = any
#                        non-restricted language of allowed rarities

ancestries:
  human:
    name: Human
    hp: 8
    size: medium
    speed: 25
    boosts:
      fixed: []
      free: 2
    flaws:
      fixed: []
      free: 0
    traits: [human, humanoid]
    languages:
      starting: [tradetongue]
      additional_per_int: true
    vision: normal
    heritages:
      - skilled_heritage
      - versatile_heritage
    features: []

  dwarf:
    name: Dwarf
    hp: 10
    size: medium
    speed: 20
    boosts:
      fixed: [con, wis]
      free: 1
    flaws:
      fixed: [cha]
      free: 0
    traits: [dwarf, humanoid]
    languages:
      starting: [tradetongue, dwarven]
      additional_per_int: true
    vision: darkvision
    heritages:
      - ancient_blooded
      - strong_blooded
    features:
      - darkvision
      - clan_dagger

  elf:
    name: Elf
    hp: 6
    size: medium
    speed: 30
    boosts:
      fixed: [dex, int]
      free: 1
    flaws:
      fixed: [con]
      free: 0
    traits: [elf, humanoid]
    languages:
      starting: [tradetongue, iliari]
      additional_per_int: true
    vision: low_light
    heritages:
      - ancient_elf
      - woodland_elf
    features:
      - low_light_vision
