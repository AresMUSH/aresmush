# Static feat reference data.
# Lookup: Pf2e.read_data("feats", "power_attack")
#
# slots: which feat-slot types may pay for this feat (required economy).
#   Allowed values: general | combat | class | skill
#   A feat may list more than one; the player chooses which available slot to spend.
#   If omitted, slots are inferred from category (see feat_slot_types_for).
#
# prerequisites / prereqs — either shape works (flat or structured all/any/none).
# Omit prerequisites (or {}) for feats with no gate beyond feat.level.

feats:
  assurance:
    name: Assurance
    level: 1
    traits: [general, skill]
    category: skill
    slots: [skill, general]
    action: null
    frequency: null
    prerequisites:
      special: "trained in at least one skill"
    effect: >
      Choose a skill you're trained in. You can forgo rolling to instead
      receive a result of 10 + proficiency bonus (do not apply ability mod,
      item, circumstance, or status bonuses/penalties).
    tags: [skill_action]

  powerful_leap:
    name: Powerful Leap
    level: 2
    traits: [general, skill]
    category: skill
    slots: [skill, general]
    action: null
    frequency: null
    prerequisites:
      skills:
        athletics: T
    effect: >
      When you Leap, you can jump 5 feet further horizontally, and
      increase the vertical distance vertically when applicable.
    tags: [skill_bonus]

  cat_fall:
    name: Cat Fall
    level: 1
    traits: [general, skill]
    category: skill
    slots: [skill, general]
    action: null
    frequency: null
    prerequisites:
      skills:
        acrobatics: T
    effect: >
      Your ability to fall safely increases with your Acrobatics proficiency.
    tags: [skill_bonus]

  quick_jump:
    name: Quick Jump
    level: 1
    traits: [general, skill]
    category: skill
    slots: [skill, general]
    action: null
    frequency: null
    prerequisites:
      skills:
        athletics: T
    effect: >
      You can use High Jump and Long Jump as a single action instead of 2.
    tags: [skill_bonus]

  intimidating_glare:
    name: Intimidating Glare
    level: 1
    traits: [general, skill]
    category: skill
    slots: [skill, general]
    action: null
    frequency: null
    prerequisites:
      skills:
        intimidation: T
    effect: >
      You can Demoralize with a glare; your Demoralize loses the auditory
      trait and gains the visual trait, and you don't take a penalty when
      the target doesn't understand your language.
    tags: [skill_action]

  toughness:
    name: Toughness
    level: 1
    traits: [general]
    category: general
    slots: [general]
    action: null
    frequency: null
    prerequisites: {}
    effect: >
      Increase your maximum HP by your level. You reduce the DC for
      recovery checks by 1.
    tags: [hp_bonus, recovery]

  power_attack:
    name: Power Attack
    level: 1
    traits: [fighter]
    category: class
    slots: [class]
    action: 2
    frequency: null
    prerequisites:
      all:
        - type: class
          slug: fighter
    effect: >
      Make a melee Strike with the required number of actions. If you hit,
      you deal an extra weapon damage die. Count as two attacks toward MAP.
    tags: [strike, extra_weapon_die, map_counts_two]

  reactive_shield:
    name: Reactive Shield
    level: 1
    traits: [fighter]
    category: class
    slots: [class]
    action: reaction
    frequency: null
    prerequisites:
      all:
        - type: class
          slug: fighter
    effect: >
      Trigger: An enemy hits you with a melee Strike. You can Raise a Shield
      and gain its benefits against the triggering attack.
    tags: [reaction, shield]

  sudden_charge:
    name: Sudden Charge
    level: 1
    traits: [fighter, flourish]
    category: class
    slots: [class, combat]
    action: 2
    frequency: null
    prerequisites:
      all:
        - type: class
          slug: fighter
    effect: >
      Stride twice. If you end your movement within melee reach of an enemy,
      you can make a melee Strike against that enemy.
    tags: [movement, strike]

  rock_runner:
    name: Rock Runner
    level: 1
    traits: [dwarf]
    category: combat
    slots: [combat]
    action: null
    frequency: null
    prerequisites:
      all:
        - type: ancestry
          slug: dwarf
    effect: >
      You ignore difficult terrain caused by stone or earth, and you can
      treat higher earth/stone obstacles more favorably when Climbing.
    tags: [movement]

  barbarian_dedication:
    name: Barbarian Dedication
    level: 2
    traits: [archetype, dedication, multiclass]
    category: class
    slots: [class]
    action: null
    frequency: null
    prerequisites:
      level: 2
      attributes:
        str: 14
      special: "not already a barbarian"
    effect: >
      You become trained in light armor, medium armor, unarmed attacks, and
      the Athletics skill (or another skill if already trained). You gain
      access to barbarian archetype feats. You do not gain rage yet.
    tags: [dedication, multiclass]
