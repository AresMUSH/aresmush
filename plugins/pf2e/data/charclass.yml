# Static class reference data (PF2e Remaster / Player Core naming).
# Lookup: Pf2e.read_data("charclasses", "fighter")
#
# advancement[level] keys (all optional):
#   features: [slug]           — automatic features (not feat slots)
#   class_feat / skill_feat / general_feat / ancestry_feat: Integer
#   skill_increase / ability_boost: Integer  — extras beyond universal table
#   proficiency: { perception, class_dc, fortitude/reflex/will,
#                  attacks: { simple|martial|unarmed|advanced },
#                  defenses: { unarmored|light|medium|heavy },
#                  skills: { slug: TEML } }
#   choice: { id, pick, options } or list of those
#   spellcasting: { rank, slots, focus, ... }  — filled when spells land
#   notes: staff-facing only
#
# Universal (code, not repeated per class):
#   skill_increase at every level 2..20
#   ability_boost ×4 at 5, 10, 15, 20
#   ancestry feat slots 1/5/9/13/17; general 3/7/11/15/19
#
# Legacy features_by_level still readable; prefer advancement.

charclasses:
  fighter:
    name: Fighter
    key_ability:
      options: [str, dex]
    hp: 10
    perception: T
    saves:
      fortitude: E
      reflex: T
      will: T
    skills:
      trained_count: 3
      additional: []
    languages:
      starting: []
      additional: 0
    attacks:
      simple: T
      martial: T
      unarmed: T
      advanced: U
    defenses:
      unarmored: T
      light: T
      medium: T
      heavy: T
    class_dc: T
    spellcasting: null
    advancement:
      1:
        features: [reactive_strike, shield_block]
        class_feat: 1
      2:
        class_feat: 1
        skill_feat: 1
      3:
        features: [bravery]
        class_feat: 1
        proficiency:
          will: E
      4:
        class_feat: 1
        skill_feat: 1
      5:
        features: [fighter_weapon_mastery]
        class_feat: 1
        proficiency:
          attacks:
            simple: E
            martial: E
            unarmed: E
      6:
        class_feat: 1
        skill_feat: 1
      7:
        features: [battlefield_surveyor, weapon_specialization]
        class_feat: 1
        proficiency:
          perception: E
          class_dc: E
      8:
        class_feat: 1
        skill_feat: 1
      9:
        features: [combat_flexibility, jogging_dodge]
        class_feat: 1
      10:
        class_feat: 1
        skill_feat: 1
      11:
        features: [fighter_expertise, battle_hardened]
        class_feat: 1
        proficiency:
          fortitude: M
          attacks:
            simple: M
            martial: M
            unarmed: M
          class_dc: E
      12:
        class_feat: 1
        skill_feat: 1
      13:
        features: [weapon_legend, armor_expertise]
        class_feat: 1
        proficiency:
          attacks:
            simple: M
            martial: M
            unarmed: M
            advanced: T
          defenses:
            light: E
            medium: E
            heavy: E
            unarmored: E
      14:
        class_feat: 1
        skill_feat: 1
      15:
        features: [greater_weapon_specialization, improved_flexibility]
        class_feat: 1
      16:
        class_feat: 1
        skill_feat: 1
      17:
        features: [armor_mastery]
        class_feat: 1
        proficiency:
          defenses:
            light: M
            medium: M
            heavy: M
            unarmored: M
      18:
        class_feat: 1
        skill_feat: 1
      19:
        features: [versatile_legend]
        class_feat: 1
        proficiency:
          attacks:
            simple: L
            martial: L
            unarmed: L
          class_dc: M
      20:
        class_feat: 1
        skill_feat: 1

