# Static class reference data (PF2e Remaster / Player Core naming).
# Lookup: Pf2e.read_data("charclasses", "fighter")
#
# languages (optional):
#   starting   — always known when this class is committed (e.g. wildsong)
#   additional — flat extra free picks granted by the class (rare)
# Restricted languages (restricted: true in languages.yml) may only appear
# under starting (or explicit grants), never as open Int picks.
#
# Feature slugs use Remaster names where they differ from classic
# (reactive_strike, wizard_spellcasting, wildsong, etc.).

charclasses:
  fighter:
    name: Fighter
    key_ability:
      options: [str, dex]
    hp: 10
    perception: T
    saves:
      fortitude: E
      reflex: T
      will: T
    skills:
      trained_count: 3
      additional: []
    languages:
      starting: []
      additional: 0
    attacks:
      simple: T
      martial: T
      unarmed: T
      advanced: U
    defenses:
      unarmored: T
      light: T
      medium: T
      heavy: T
    class_dc: T
    spellcasting: null
    features_by_level:
      1:
        - reactive_strike
        - fighter_feat
        - shield_block
      2:
        - fighter_feat
        - skill_feat

  wizard:
    name: Wizard
    key_ability:
      options: [int]
    hp: 6
    perception: T
    saves:
      fortitude: T
      reflex: T
      will: E
    skills:
      trained_count: 2
      additional:
        - arcana
    languages:
      starting: []
      additional: 0
    attacks:
      simple: T
      martial: U
      unarmed: T
      advanced: U
    defenses:
      unarmored: T
      light: U
      medium: U
      heavy: U
    class_dc: T
    spellcasting:
      tradition: arcane
      rank: T
      type: prepared
      # Remaster: spell rank (not "spell level"); curriculum replaces classic schools
    features_by_level:
      1:
        - wizard_spellcasting
        - arcane_school          # Remaster curriculum school (School of Mentalism, etc.)
        - arcane_bond
        - arcane_thesis
        - wizard_feat
      2:
        - wizard_feat
        - skill_feat

  rogue:
    name: Rogue
    key_ability:
      options: [dex]
    hp: 8
    perception: E
    saves:
      fortitude: T
      reflex: E
      will: T
    skills:
      trained_count: 7
      additional:
        - stealth
    languages:
      starting: []
      additional: 0
    attacks:
      simple: T
      martial: T
      unarmed: T
      advanced: U
    defenses:
      unarmored: T
      light: T
      medium: U
      heavy: U
    class_dc: T
    spellcasting: null
    features_by_level:
      1:
        - rogue_feat
        - sneak_attack
        - surprise_attack
        - rogues_racket
      2:
        - rogue_feat
        - skill_feat

  # Sample only — may not be open to PCs at launch.
  druid:
    name: Druid
    key_ability:
      options: [wis]
    hp: 8
    perception: T
    saves:
      fortitude: T
      reflex: T
      will: E
    skills:
      trained_count: 2
      additional:
        - nature
    languages:
      starting: [wildsong]
      additional: 0
    attacks:
      simple: T
      martial: U
      unarmed: T
      advanced: U
    defenses:
      unarmored: T
      light: T
      medium: U
      heavy: U
    class_dc: T
    spellcasting:
      tradition: primal
      rank: T
      type: prepared
    features_by_level:
      1:
        - druid_spellcasting
        - anathema
        - wildsong
        - druidic_order
        - druid_feat
      2:
        - druid_feat
        - skill_feat
