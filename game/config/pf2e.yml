pf2e:
  shortcuts:
    csheet: sheet/combat
    inv: gear
    inventory: gear
    inv/add: gear/add
    inventory/add: gear/add
    inv/drop: gear/drop
    inventory/drop: gear/drop
    inv/equip: gear/equip
    inventory/equip: gear/equip
    inv/unequip: gear/unequip
    inventory/unequip: gear/unequip
    inv/stow: gear/stow
    inventory/stow: gear/stow
    inv/retrieve: gear/retrieve
    inventory/retrieve: gear/retrieve
  # When true, bulk is calculated and shown; society-account coin is excluded.
  use_encumbrance: true
  # Granted once at cg/commit (identity lock). Re-granted after cg/reset + commit.
  starting_wealth: "15gp"
  # society = Hall ledger (default); purse = coins on person
  starting_wealth_to: society

  # -------------------------------------------------
  # Experience (PF2e Remaster / Player Core)
  # XP on the sheet is progress toward the *next* level only.
  # On level-up finish: xp -= xp_to_level (remainder carries).
  # -------------------------------------------------
  xp_to_level: 1000
  # Logged/shared scenes: SceneSharedEvent awards scene_xp to participants once.
  scene_xp_enabled: true
  scene_xp: 10

  # -------------------------------------------------
  # Vendors
  # Item level must be <= character level + offset to buy from a coded shop.
  # Higher-level gear: staff job + staff issue only (pf2e/set item/...).
  # Catalog entries use level: N; missing level counts as 0 (mundane).
  # Spell items without level derive 2*rank-1 from the spell payload.
  # -------------------------------------------------
  vendor_level_lock: true
  vendor_level_offset: 0
